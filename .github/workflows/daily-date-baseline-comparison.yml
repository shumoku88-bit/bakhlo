name: Temporary Native CI for Simplification

on:
  pull_request:
    paths:
      - 'application/actual_validity.mli'
      - 'sexp/daily_book.ml'
      - 'test/incremental_admission_oracle_tests.ml'
      - 'test/sexp_book.t'
      - 'test/compiler_policy.t'
      - '.github/workflows/daily-date-baseline-comparison.yml'

permissions:
  contents: read

jobs:
  full-native-check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.3.0'
          opam-pin: false
          dune-cache: false
      - name: Install existing test dependencies
        run: opam install . --deps-only --with-test -y
      - name: Compile the whole native workspace
        run: opam exec -- dune build --root . @all
      - name: Run all existing native Cram and expect tests
        run: opam exec -- dune runtest --root . --force
