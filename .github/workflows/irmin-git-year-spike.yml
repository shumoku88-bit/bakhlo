name: Irmin Git annual synthetic spike

on:
  pull_request:
    paths:
      - "experiments/irmin-git-year-spike/**"
      - ".github/workflows/irmin-git-year-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-git-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3.0"
          opam-pin: false
          dune-cache: false
      - name: Install Bakhlo Core and Irmin Git in isolated runner
        run: |
          opam install . --deps-only --with-test --locked -y
          opam install -y irmin-git.3.11.0
      - name: Build and exercise isolated year paths
        run: opam exec -- dune exec --root experiments/irmin-git-year-spike ./spike.exe
      - name: Connect selected Git commit to Bakhlo Year_read and Core
        run: sh experiments/irmin-git-year-spike/scripts/build-core-bridge.sh
