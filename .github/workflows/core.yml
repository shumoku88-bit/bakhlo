name: Build and tests (core, bk commands and TUI)

on:
  push:
    branches: [main]
    paths:
      - "household/**"
      - "book_txt/**"
      - "test/**"
      - "examples/**"
      - "cli/**"
      - "tui/**"
      - "store/**"
      - "tools/check"
      - "tools/household"
      - "tools/ci-tui-pty"
      - "tools/dune"
      - "tools/*.ml"
      - "dune*"
      - "bakhlo.opam*"
      - ".github/workflows/core.yml"
  pull_request:
    paths:
      - "household/**"
      - "book_txt/**"
      - "test/**"
      - "examples/**"
      - "cli/**"
      - "tui/**"
      - "store/**"
      - "tools/check"
      - "tools/household"
      - "tools/ci-tui-pty"
      - "tools/dune"
      - "tools/*.ml"
      - "dune*"
      - "bakhlo.opam*"
      - ".github/workflows/core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4.1"
          opam-pin: false
          dune-cache: false
      - name: Install existing locked test dependencies
        run: opam install . --deps-only --with-test --locked -y
      - name: Build
        run: opam exec -- dune build
      - name: Samples, regression and synthetic bk command and TUI tests
        run: opam exec -- dune runtest
      # A real PTY: keys, resize, Ctrl-Q, cold reopen and the narrow Record Preview
      # refusal on the synthetic fixture; never household data, macOS IME or LOAM.
      - name: Linux PTY keyboard, resize and non-writing matrix
        run: |
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends expect
          install -d -m 0700 scratch
          tools/ci-tui-pty _build/default/tui/app/bakhlo_tui.exe examples/book.txt
