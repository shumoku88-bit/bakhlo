name: Build and tests (core and bk commands)

on:
  push:
    branches: [main]
    paths:
      - "household/**"
      - "book_txt/**"
      - "test/**"
      - "examples/**"
      - "cli/**"
      - "store/**"
      - "tools/check"
      - "tools/household"
      - "tools/dune"
      - "tools/*.ml"
      - "dune*"
      - "bakhlo.opam*"
      - ".github/workflows/core.yml"
  pull_request:
    paths:
      - "household/**"
      - "book_txt/**"
      - "test/**"
      - "examples/**"
      - "cli/**"
      - "store/**"
      - "tools/check"
      - "tools/household"
      - "tools/dune"
      - "tools/*.ml"
      - "dune*"
      - "bakhlo.opam*"
      - ".github/workflows/core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4.1"
          opam-pin: false
          dune-cache: false
      - name: Install existing locked test dependencies
        run: opam install . --deps-only --with-test --locked -y
      - name: Build
        run: opam exec -- dune build
      - name: Samples, regression and synthetic bk command tests
        run: opam exec -- dune runtest
